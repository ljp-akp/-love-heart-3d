<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>3D Love</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
overflow:hidden;
height:100vh;
perspective:1200px;
}

.scene{
position:absolute;
left:50%;
top:50%;
transform-style:preserve-3d;
}

.card{
position:absolute;
width:60px;
height:36px;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
font-weight:bold;
color:#333;
box-shadow:
0 0 20px rgba(255,255,255,.3);
}

.center{
background:#ffd6e5;
color:#222;
}
</style>
</head>

<body>

<div class="scene" id="heart"></div>

<script>

const heart=document.getElementById("heart");

let cards=[];

function heartPoint(t){

return{
x:16*Math.pow(Math.sin(t),3),
y:-(13*Math.cos(t)
-5*Math.cos(2*t)
-2*Math.cos(3*t)
-Math.cos(4*t))
};

}

for(let i=0;i<120;i++){

const card=document.createElement("div");

card.className="card";

if(i===60){
card.innerHTML="我爱你";
card.classList.add("center");
}else{
card.innerHTML="";
}

card.style.background=
`hsl(${i*3},80%,85%)`;

heart.appendChild(card);

cards.push(card);

}

let rot=0;

function animate(){

rot+=0.01;

cards.forEach((card,i)=>{

const t=i/cards.length*Math.PI*2;

const p=heartPoint(t);

const z=Math.sin(t*3+rot)*120;

const x=p.x*18;
const y=p.y*18;

card.style.transform=
`
translate3d(
${x}px,
${y}px,
${z}px
)
rotateY(${rot*100}deg)
`;

});

heart.style.transform=
`
translate(-50%,-50%)
rotateY(${rot*40}deg)
rotateX(20deg)
`;

requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
